[project]
name = "adam-sql"
version = "0.1.0"
description = "Generate ADAM SQL initialization files from YAML definitions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "uuid6>=2024.7.10",
]

[tool.uv]
package = false

[dependency-groups]
validation = [
    "psycopg[binary]>=3.2,<4",
    "pymongo>=4.10,<5",
]
