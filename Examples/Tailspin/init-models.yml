tenants:
  - id: tenantA
    name: My_Tenant_A
    description: Tenant principale pour les tests
  - id: tenantB
    name: My_Tenant_B
    description: Tenant secondaire pour montreer l'isolation

models: 
  type users:
    relations:
      - collaborateur:
        - relations: users
      - adherent:
        - relations: users

  type tailspin:
    roles:
      - dataController:
        - relations: users#collaborateur
        policy:
          - name: dossier_can_read_public
            resource: tailspin.dossier
            action: select
            conditions:
              - is_confidentiel: false
              - tenant: tenant_id
      - statistique:
        - relations: users#collaborateur
      - admin:
        - relations: users#collaborateur

  type dossier:
    relations:
      - proprietaire:
        - relations: users#adherent
      - gestionnaire:
        - relations: users#collaborateur
      - comptable:
        - relations: users#collaborateur
    roles:
      - reader:
        - relations: proprietaire
        - relations: gestionnaire
        - relations: comptable
        policy:
          - name: dossier_can_read
            resource: tailspin.dossier
            action: select
            conditions:
              - id: object_id
              - tenant: tenant_id
