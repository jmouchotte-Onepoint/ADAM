tenants:
  - id: tenantA
    name: My_Tenant_A
    description: Tenant principale pour les tests
  - id: tenantB
    name: My_Tenant_B
    description: Tenant secondaire pour montrer l'isolation

rules:
  - id: 6bb6f839-61d5-4968-9fa1-87383df1344d
    sql: select 1 from contoso.dossier as dossier where dossier.id= $idDossier and dossier.is_confidentiel = $isConfidentiel;
    params:
      - idDossier
      - isConfidentiel

models: 
  type users:
    relations:
      - collaborateur:
        - relations: users
      - adherent:
        - relations: users

  type contoso:
    relations:
      - dataController:
        - relations: users#collaborateur
      - statistique:
        - relations: users#collaborateur
      - admin:
        - relations: users#collaborateur

  type dossier:
    relations:
      - proprietaire:
        - relations: users#adherent
      - gestionnaire:
        - relations: users#collaborateur
      - parent: 
        - relations: contoso
    roles:
      - dataControllerReader:
        - relations: dataController from parent
          #condition à l'écriture dans le model
          rules:
            - id: 6bb6f839-61d5-4968-9fa1-87383df1344d
              params:
                idDossier: object_id
                isConfidentiel: 'false'
        #condition à la lecture
        policy: 
          - name: dossier_can_read
            resource: contoso.dossier
            action: select
            attributes: true
            conditions:
              - id: object_id
      - reader:
        - relations: proprietaire
        - relations: gestionnaire
        policy: 
          - name: dossier_can_read_all
            resource: contoso.dossier
            rules: true
            action: select
            conditions:
              - id: object_id
